[build-system]
requires = ["hatchling>=1.30", "packaging>=24.0", "meson>=0.49", "ninja", "VapourSynth>=79"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-dfttest"
version = "1.1"
description = "DFTTest frequency-domain denoiser plugin for VapourSynth"
readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "DFTTest contributors" }]
dependencies = ["VapourSynth>=79"]

[project.urls]
"Source Code" = "https://github.com/RyougiKukoc/VapourSynth-DFTTest-api4"
"Releases" = "https://github.com/RyougiKukoc/VapourSynth-DFTTest-api4/releases"

[tool.hatch.build.targets.sdist]
include = [
  "DFTTest",
  "LICENSE",
  "README.md",
  "hatch_build.py",
  "meson.build",
  "pyproject.toml",
  "tools",
]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
  "vapoursynth/plugins/**/*.dll",
  "vapoursynth/plugins/**/*.so*",
  "vapoursynth/plugins/**/*.dylib",
  "vapoursynth/plugins/**/manifest.vs",
  "vapoursynth/plugins/**/LICENSE",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
